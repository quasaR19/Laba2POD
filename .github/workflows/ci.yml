name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GeocodingSystem.slnx

      - name: Build
        run: dotnet build GeocodingSystem.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test GeocodingSystemApp.Tests/GeocodingSystemApp.Tests.csproj --no-build --configuration Release --verbosity normal
